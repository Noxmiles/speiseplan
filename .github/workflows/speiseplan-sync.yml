name: Speiseplan Auto-Sync (HessenTreff)

on:
  schedule:
    # Dienstag bis Freitag: 1x täglich morgens (05:30 UTC -> ca. 06:30 / 07:30 Uhr deutscher Zeit)
    - cron: '30 5 * * 2-5'

    # Samstag: 1x täglich (08:00 UTC -> ca. 09:00 / 10:00 Uhr deutscher Zeit)
    - cron: '0 8 * * 6'

    # Sonntag: 3x täglich (08:00, 13:00, 18:00 UTC -> morgens, nachmittags, abends)
    - cron: '0 8,13,18 * * 0'

    # Montag: 3x täglich (05:00, 08:30, 12:00 UTC -> vor Dienstbeginn, Vormittag, Mittag)
    - cron: '0 5,12 * * 1'
    - cron: '30 8 * * 1'

  workflow_dispatch: # Ermöglicht jederzeit das manuelle Starten per Klick im Browser

jobs:
  sync-speiseplan:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Code auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔍 Poppler (PDF) & Tesseract OCR (Fallback inkl. tessdata_best) installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-deu
          # tessdata_best für maximale Erkennungspräzision (Float32 Modell) herunterladen
          TESSDATA_DIR=$(tesseract --list-langs 2>&1 | grep -oP '(?<=in ")[^"]+' || echo "/usr/share/tessdata")
          echo "Hauptverzeichnis tessdata: ${TESSDATA_DIR}"
          sudo curl -fsSL --retry 3 --retry-delay 2 -o "${TESSDATA_DIR}/deu.traineddata" https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/deu.traineddata
          # Auch in parallele Tesseract-Verzeichnisse kopieren falls vorhanden
          for dir in /usr/share/tessdata /usr/share/tesseract-ocr/4.00/tessdata /usr/share/tesseract-ocr/5/tessdata; do
            if [ -d "$dir" ] && [ "$dir" != "${TESSDATA_DIR%/}" ]; then
              sudo cp -f "${TESSDATA_DIR}/deu.traineddata" "$dir/" || true
            fi
          done
          tesseract --list-langs

      - name: 📦 Python-Pakete installieren
        run: |
          pip install -r requirements.txt

      - name: 🚀 Speiseplan auslesen (PDF / OCR-Fallback) & live zu Hetzner beamen
        env:
          SYNC_MODE: 'webhook'
          WEBHOOK_URL: 'https://kantine.alexander-ochs.dev/index.php'
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN || 'D784AC8549AB49DE5BE2A5AEF1EC6A679577DFBDD68DCF02EA209199004C2959' }}
          SYNC_SOURCE: 'g'
        run: |
          python3 sync_daily.py --force

name: Speiseplan Auto-Sync (HessenTreff)

on:
  schedule:
    # Dienstag bis Freitag: 1x täglich morgens (05:30 UTC -> ca. 06:30 / 07:30 Uhr deutscher Zeit)
    - cron: '30 5 * * 2-5'

    # Samstag: 1x täglich (08:00 UTC -> ca. 09:00 / 10:00 Uhr deutscher Zeit)
    - cron: '0 8 * * 6'

    # Sonntag: 3x täglich (08:00, 13:00, 18:00 UTC -> morgens, nachmittags, abends)
    - cron: '0 8,13,18 * * 0'

    # Montag: 3x täglich (05:00, 08:30, 12:00 UTC -> vor Dienstbeginn, Vormittag, Mittag)
    - cron: '0 5,12 * * 1'
    - cron: '30 8 * * 1'

  workflow_dispatch: # Ermöglicht jederzeit das manuelle Starten per Klick im Browser

jobs:
  sync-speiseplan:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Code auschecken
        uses: actions/checkout@v4

      - name: 🐍 Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🔍 Tesseract OCR & deutsche Sprachdaten installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-deu

      - name: 📦 Python-Pakete installieren
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: 🚀 OCR ausführen & Speiseplan live zu Hetzner beamen
        env:
          SYNC_MODE: 'webhook'
          WEBHOOK_URL: 'https://kantine.alexander-ochs.dev/index.php'
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN || 'kantine-geheim-2026' }}
        run: |
          python3 sync_daily.py --force
